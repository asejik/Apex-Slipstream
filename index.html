<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="description" content="Apex Slipstream - A high-performance 3D arcade racing championship for web and mobile browsers." />
    <title>Apex Slipstream</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0a14;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 16px) + 12px)
                 calc(env(safe-area-inset-right, 16px) + 16px)
                 calc(env(safe-area-inset-bottom, 16px) + 12px)
                 calc(env(safe-area-inset-left, 16px) + 16px);
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        background: rgba(0, 230, 153, 0.15);
        border: 1px solid #00e699;
        border-radius: 4px;
        color: #00e699;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .hud-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-top: 4px;
      }
      .hud-sub {
        font-size: 12px;
        color: #8b8ea4;
        margin-top: 2px;
      }
      .btn-camera {
        pointer-events: auto;
        cursor: pointer;
        background: rgba(18, 22, 38, 0.85);
        border: 1px solid rgba(0, 230, 153, 0.4);
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        padding: 8px 14px;
        border-radius: 6px;
        backdrop-filter: blur(8px);
        transition: all 0.15s ease;
      }
      .btn-camera:hover {
        background: rgba(0, 230, 153, 0.2);
        border-color: #00e699;
      }
      .drift-alert {
        align-self: center;
        background: rgba(255, 170, 0, 0.2);
        border: 1px solid #ffaa00;
        color: #ffaa00;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 4px 14px;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      .bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .controls-hint {
        background: rgba(10, 10, 20, 0.7);
        backdrop-filter: blur(8px);
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 12px;
        color: #b0b4c8;
      }
      .controls-hint strong {
        color: #00e699;
      }
      .speedometer-card {
        background: rgba(10, 10, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 230, 153, 0.25);
        border-radius: 10px;
        padding: 10px 18px;
        min-width: 140px;
        text-align: right;
      }
      .speed-readout {
        display: flex;
        justify-content: flex-end;
        align-items: baseline;
        gap: 6px;
      }
      .speed-number {
        font-family: monospace;
        font-size: 38px;
        font-weight: 800;
        line-height: 1;
        color: #ffffff;
      }
      .speed-unit {
        font-size: 13px;
        font-weight: 700;
        color: #00e699;
        letter-spacing: 0.5px;
      }
      .rpm-bar-bg {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 6px;
        overflow: hidden;
      }
      .rpm-bar-fill {
        height: 100%;
        width: 20%;
        background: linear-gradient(90deg, #00e699, #ffcc00, #ff3344);
        border-radius: 2px;
        transition: width 0.05s ease;
      }
      #fps-counter {
        margin-top: 4px;
        font-family: monospace;
        font-size: 11px;
        color: #72768e;
      }
      #error-banner {
        display: none;
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ff3344;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        z-index: 9999;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-overlay">
        <div class="top-row">
          <div>
            <span class="badge">Milestone 2 — Vehicle Physics & Cameras</span>
            <h1 class="hud-title">Apex Slipstream</h1>
            <p class="hud-sub">Fixed 60Hz Physics · 3 View Modes · Inertia & Drift</p>
          </div>
          <button class="btn-camera" id="btn-camera-toggle">
            <span id="camera-mode-badge">Camera [C]: High-Chase</span>
          </button>
        </div>

        <div class="drift-alert" id="drift-indicator">
          ⚡ DRIFTING ⚡
        </div>

        <div class="bottom-row">
          <div class="controls-hint">
            <strong>W / ↑</strong> Accel · <strong>S / ↓</strong> Brake · <strong>A/D / ←/→</strong> Steer · <strong>Space</strong> Drift · <strong>C</strong> View
            <div id="fps-counter">FPS: -- | Physics: 60Hz Fixed</div>
          </div>

          <div class="speedometer-card">
            <div class="speed-readout">
              <span class="speed-number" id="speed-value">0</span>
              <span class="speed-unit">KM/H</span>
            </div>
            <div class="rpm-bar-bg">
              <div class="rpm-bar-fill" id="rpm-bar-fill"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="error-banner"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
