<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="cyber-flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Speed Chevron Streaks -->
  <path d="M 60 210 L 230 210 L 190 260 L 60 260 Z" fill="url(#cyber-cyan)" opacity="0.4"/>
  <path d="M 90 275 L 210 275 L 180 315 L 90 315 Z" fill="url(#cyber-cyan)" opacity="0.6"/>

  <!-- Cyber Race Car Silhouette -->
  <g transform="translate(140, 150) scale(1.1)" filter="url(#glow)">
    <!-- Aerodynamic Chassis -->
    <path d="M 10 160 L 50 140 L 90 90 L 150 90 L 185 130 L 220 140 L 230 160 Z" fill="#090d16" stroke="#00f0ff" stroke-width="6"/>
    <!-- Cockpit Canopy -->
    <polygon points="95,95 145,95 175,130 75,130" fill="url(#cyber-cyan)" opacity="0.85"/>
    <!-- Rear Wing Spoiler -->
    <rect x="0" y="115" width="30" height="8" rx="2" fill="#ff2a5f"/>
    <rect x="18" y="123" width="6" height="25" fill="#555"/>
    <!-- Wheels & Glowing Rims -->
    <circle cx="65" cy="165" r="28" fill="#111" stroke="#00f0ff" stroke-width="5"/>
    <circle cx="65" cy="165" r="10" fill="#00f0ff"/>
    <circle cx="185" cy="165" r="28" fill="#111" stroke="#00f0ff" stroke-width="5"/>
    <circle cx="185" cy="165" r="10" fill="#00f0ff"/>
    <!-- Slipstream Tail Flame -->
    <path d="M -5 145 Q -40 148 -70 140 Q -40 155 -5 155 Z" fill="url(#cyber-flame)"/>
  </g>

  <!-- Speed Text Accent -->
  <text x="256" y="435" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="34" letter-spacing="6" fill="#00f0ff">APEX SLIPSTREAM</text>
</svg>
